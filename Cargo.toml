[package]
name = "rtsp-image-capture"
version = "0.1.2"
edition = "2021"

[lib]
name = "rtsp_lib"
path = "src/lib.rs"


[dependencies]
async-trait = "0.1.83"
futures = "0.3.31"
ipc = { git = "https://github.com/Felipe-Hideki/ipc.git", branch = "1.2.0", features = [
  "async",
] }
onvif = { git = "https://github.com/Felipe-Hideki/onvif-rs" }
retina = "0.4.12"
tokio = { version = "1.41.1", features = ["full"] }
turbojpeg = "1.1.1"
url = "2.5.4"
